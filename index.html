<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIKKE Gacha Tracker</title>
  <!-- CSS 연결 -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="main-content">
    
    <div class="top-header">
      <span class="header-tab tab-btn-input active" onclick="window.ui.switchView('input')">기록</span>
      <span style="color:var(--border);">|</span>
      <span class="header-tab tab-btn-history" onclick="window.ui.switchView('history')">보관소</span>
      <span id="editStatusBadge" style="display:none; font-size:0.85rem; background:#ffe0b2; color:#e67e22; padding:4px 10px; border-radius:12px; margin-left:10px;">✏️ 수정 모드</span>
    </div>

    <!-- 입력창 화면 -->
    <div id="view-input" class="module-view active">
      <div class="card">
        <div class="compact-row">
          <div class="input-group col-xlarge"><label>한글 이름</label><input type="text" id="nameKor" placeholder="예: 앨리스 : 원더랜드 바니" style="border-left: 4px solid var(--attr-fire);"></div>
          <div class="input-group col-small" style="min-width: 140px;"><label>속성</label>
            <div class="custom-select-wrapper">
              <div class="custom-select-trigger" onclick="window.ui.toggleAttrMenu(event)">
                <div class="attr-content"><span id="selectedAttrText">작열</span><img id="selectedAttrIcon" src="fire.png" alt="작열"></div><span style="font-size: 0.7rem; color: #aaa;">▼</span>
              </div>
              <div class="custom-options" id="attrOptions">
                <div class="custom-option" onclick="window.ui.selectAttr('fire', '작열', 'fire.png')"><div class="attr-content"><span>작열</span><img src="fire.png" alt="작열"></div></div>
                <div class="custom-option" onclick="window.ui.selectAttr('wind', '풍압', 'wind.png')"><div class="attr-content"><span>풍압</span><img src="wind.png" alt="풍압"></div></div>
                <div class="custom-option" onclick="window.ui.selectAttr('iron', '철갑', 'iron.png')"><div class="attr-content"><span>철갑</span><img src="iron.png" alt="철갑"></div></div>
                <div class="custom-option" onclick="window.ui.selectAttr('electric', '전격', 'electric.png')"><div class="attr-content"><span>전격</span><img src="electric.png" alt="전격"></div></div>
                <div class="custom-option" onclick="window.ui.selectAttr('water', '수냉', 'water.png')"><div class="attr-content"><span>수냉</span><img src="water.png" alt="수냉"></div></div>
              </div>
            </div>
          </div>
          <div class="input-group col-small"><label>소속</label><select id="nikkeMaker"><option>엘리시온</option><option>미실리스</option><option>테트라</option><option>필그림</option><option>어브노멀</option></select></div>
          <div class="input-group col-small"><label>무기</label><select id="nikkeWeapon"><option>SR</option><option>SMG</option><option>SG</option><option>RL</option><option>MG</option><option>AR</option></select></div>
        </div>
        <div class="compact-row" style="margin-bottom: 0;">
          <div class="input-group col-large"><label>영어 이름</label><input type="text" id="nameEng" placeholder="예: Alice: Wonderland Bunny"></div>
          <div class="input-group col-small">
            <label>출시 타입</label>
            <input type="text" id="bannerType" list="bannerTypeList" placeholder="직접입력/선택" autocomplete="off">
            <datalist id="bannerTypeList">
              <option value="일반 통상 출시"></option><option value="통상 이격 출시"></option><option value="여름 한정 출시"></option><option value="겨울 한정 출시"></option><option value="필그림 픽업"></option><option value="콜라보 한정 출시"></option>
            </datalist>
          </div>
          <div class="input-group col-large"><label>스토리명</label><input type="text" id="storyName" placeholder="예: COIN RUSH"></div>
          <div class="input-group col-xlarge"><label>모집 기간 (또는 출시일)</label>
            <div style="display: flex; align-items: center; gap: 6px;">
              <input type="text" id="dateStart" placeholder="예: 2026년 7월 30일" style="flex: 1; padding-left: 5px; padding-right: 5px;">
            </div>
          </div>
        </div>
      </div>

      <div class="account-bar" id="accountBar">
        <button class="acc-btn active" onclick="window.ui.selectAccount(this, '1 케니')">1 케니</button>
        <button class="acc-btn" onclick="window.ui.selectAccount(this, '2 키니시')">2 키니시</button>
        <button class="acc-btn" onclick="window.ui.selectAccount(this, '3 키니')">3 키니</button>
        <button class="acc-btn" onclick="window.ui.selectAccount(this, '4 키치')">4 키치</button>
        <button class="acc-btn" onclick="window.ui.selectAccount(this, '5 키시')">5 키시</button>
        <button class="acc-btn" onclick="window.ui.selectAccount(this, '6 키키')">6 키키</button>
        <button class="acc-btn" onclick="window.ui.selectAccount(this, '7 키피')">7 키피</button>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 10px;">
          <h3 style="margin: 0; font-size: 1.1rem;">뽑기 기록</h3>
          <span style="font-size: 0.9rem; color: var(--primary); font-weight: bold;" id="pageIndicator">1~100회 구간</span>
        </div>
        <div class="pull-grid-input" id="pullContainer"></div>
        <div class="pagination" id="paginationContainer"></div>
      </div>

      <button class="btn-save" id="btnSaveToDB">데이터베이스에 저장하기</button>
      <button class="btn-reset" onclick="window.ui.clearForm()">🔄 새 배너 기록하기 (입력칸 비우기)</button>
    </div>

    <!-- 보관소 화면 -->
    <div id="view-history" class="module-view">
      <div class="account-bar" style="margin-bottom: 20px;">
        <button class="acc-btn btn-all" onclick="window.ui.filterHistory('ALL', this)">🌟 전체 통합</button>
        <button class="acc-btn active" onclick="window.ui.filterHistory('1 케니', this)">1 케니</button>
        <button class="acc-btn" onclick="window.ui.filterHistory('2 키니시', this)">2 키니시</button>
        <button class="acc-btn" onclick="window.ui.filterHistory('3 키니', this)">3 키니</button>
        <button class="acc-btn" onclick="window.ui.filterHistory('4 키치', this)">4 키치</button>
        <button class="acc-btn" onclick="window.ui.filterHistory('5 키시', this)">5 키시</button>
        <button class="acc-btn" onclick="window.ui.filterHistory('6 키키', this)">6 키키</button>
        <button class="acc-btn" onclick="window.ui.filterHistory('7 키피', this)">7 키피</button>
      </div>

      <div id="historyContainer">
        <p style="text-align: center; color: #aaa; padding: 20px;">데이터를 불러오는 중입니다...</p>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn tab-btn-input active" onclick="window.ui.switchView('input')">기록</button>
    <button class="nav-btn tab-btn-history" onclick="window.ui.switchView('history')">보관소</button>
  </div>

  <!-- 스크립트 진입점 (ES6 모듈 사용) -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
